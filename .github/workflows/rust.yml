name: rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cd rust && cargo clippy --release --all-targets -- -D warnings
      - run: mkdir -p "$RUNNER_TEMP/tmp" && TMPDIR="$RUNNER_TEMP/tmp" sh -c 'cd rust && cargo test --release'
  reticulum-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The replica with Channel queries, katzenpost/pigeonhole_rns#3; it brings rns and hpqc.
      - run: pip install "pigeonhole-rns @ git+https://github.com/katzenpost/pigeonhole_rns@channel-mode"
      - run: cd rust && cargo clippy --release --all-targets --features reticulum-rs -- -D warnings
      - run: mkdir -p "$RUNNER_TEMP/tmp" && TMPDIR="$RUNNER_TEMP/tmp" sh -c 'cd rust && timeout 1200 cargo test --release --features reticulum-rs'
      # Reticulum-rs against Python RNS, and the backend against a pigeonhole_rns replica.
      - run: cd rust && PYTHON=python timeout 600 cargo test --release --features reticulum-rs --test reticulum_rs -- --ignored --test-threads 1
